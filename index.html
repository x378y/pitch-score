<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Score</title>
<meta name="description" content="Game scores for every MLB start and relief outing by the pitchers you follow.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitch Score">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a scorebook page — pitcher list, then a pitcher's season chart and game log. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --fg: #16201b;
  --muted: #5d6b64;
  --line: #dde3e0;
  --accent: #1d6b45;
  --accent-soft: #e2efe8;
  --post: #8a5a00;
  --post-soft: #f6ecd6;
  --bad: #b3261e;
  --good: #1d6b45;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-elite: #6b3fc4; --t-great: #17633f; --t-good: #3a9a5b; --t-avg: #6c7a73;
  --t-below: #b07d12; --t-poor: #cc5a1f; --t-dis: #b3261e;
  --c1: #2563c9; --c2: #d9772b; --c3: #8a4fd1; --c4: #0f8f80; --c5: #c2407a; --c6: #5f6f0e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #161e1a; --fg: #e6ece9; --muted: #93a39b; --line: #27322c;
    --accent: #5cc792; --accent-soft: #1b3428; --post: #e0b155; --post-soft: #33290f;
    --bad: #f08a80; --good: #5cc792; color-scheme: dark;
    --t-elite: #b9a0f2; --t-great: #4fc489; --t-good: #93d8a9; --t-avg: #9aa7a1;
    --t-below: #e2b453; --t-poor: #f0935c; --t-dis: #f08a80;
    --c1: #6fa0f0; --c2: #f0a060; --c3: #b48af0; --c4: #4fd1c0; --c5: #f080b0; --c6: #b8c860;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #161e1a; --fg: #e6ece9; --muted: #93a39b; --line: #27322c;
  --accent: #5cc792; --accent-soft: #1b3428; --post: #e0b155; --post-soft: #33290f;
  --bad: #f08a80; --good: #5cc792; color-scheme: dark;
    --t-elite: #b9a0f2; --t-great: #4fc489; --t-good: #93d8a9; --t-avg: #9aa7a1;
    --t-below: #e2b453; --t-poor: #f0935c; --t-dis: #f08a80;
    --c1: #6fa0f0; --c2: #f0a060; --c3: #b48af0; --c4: #4fd1c0; --c5: #f080b0; --c6: #b8c860;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 20px;
}
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; line-height: 1; text-decoration: none; color: var(--fg); }
.brand span { color: var(--accent); }
.season { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.top .spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-size: 14px; font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.danger { color: var(--bad); }
header .btn[aria-current] { border-color: var(--accent); background: var(--accent-soft); }
header.top .spacer { flex-basis: 100%; height: 0; }
header.top .brand, header.top select { order: -2; }
#refresh { order: -1; margin-left: auto; }
@media (max-width: 440px) { header.top { gap: 6px; } header.top .btn:not(select) { padding: 6px 8px; font-size: 13px; } header.top select { padding: 5px 4px; font-size: 11px; } }
.status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.status.err { color: var(--bad); }

h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* add pitcher */
.add { position: relative; }
.add input {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
}
.results { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.results li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.results li:first-child { border-top: 0; }
.results li .nm { flex: 1; min-width: 0; }
.results li .sub { color: var(--muted); font-size: 13px; }

/* pitcher list */
.board { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto 4.2em; gap: 12px; align-items: center;
  padding: 12px 14px; border-top: 1px solid var(--line); text-decoration: none; color: inherit;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.rank { font-family: var(--font-display); font-size: 20px; color: var(--muted); text-align: center; }
.who { min-width: 0; }
.who .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .sub { color: var(--muted); font-size: 13px; }
.spark { width: 96px; height: 30px; display: block; }
.avg { text-align: right; }
.avg .v { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; }
.avg .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 440px) { .spark { display: none; } .row { gap: 8px; grid-template-columns: 1.6em minmax(0, 1fr) 4.2em; } }
#view { display: flex; flex-direction: column; gap: 28px; }

/* pitcher page */
.crumbs { font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fact { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.fact .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.chartbox { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px; }
.chartbox svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 2; }
th.stuck { box-shadow: 0 1px 0 var(--line), 0 6px 10px -6px rgba(0,0,0,.35); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
tbody tr.g { cursor: pointer; border-top: 1px solid var(--line); }
tbody tr.g:hover { background: var(--accent-soft); }
td.sc { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; background: var(--post-soft); color: var(--post); margin-left: 6px; vertical-align: 1px; }
tr.bd td { text-align: left; white-space: normal; background: var(--bg); padding: 10px 12px 14px; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 18px; font-size: 13px; }
.breakdown div { display: flex; justify-content: space-between; gap: 8px; }
.breakdown .p { color: var(--good); font-variant-numeric: tabular-nums; }
.breakdown .m { color: var(--bad); font-variant-numeric: tabular-nums; }
.breakdown .tot { font-weight: 600; border-top: 1px solid var(--line); padding-top: 4px; grid-column: 1 / -1; }
.note { font-size: 12px; color: var(--muted); }

/* formula */
.formula { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.formula code { font-size: 13px; overflow-wrap: anywhere; }
.weights { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 18px; font-size: 14px; }
.weights div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* tiers */
.pill { display: inline-block; font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .02em; line-height: 1.4;
  padding: 1px 7px; border-radius: 999px; color: var(--t); background: color-mix(in srgb, var(--t) 14%, transparent); white-space: nowrap; vertical-align: 2px; }
td.sc .pill { margin-left: 6px; }
.tiertable { display: flex; flex-direction: column; gap: 6px; }
.tiertable div { display: grid; grid-template-columns: 7.5em 5em minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.tiertable .ex { color: var(--muted); font-size: 13px; }
.tiertable .pill { justify-self: start; }

/* compare */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; font-size: 14px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.chip[aria-pressed="true"] { border-color: var(--c); }
.chip[aria-pressed="true"] i { background: var(--c); }
.chip[aria-pressed="false"] { color: var(--muted); }
.seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.dist { display: flex; height: 10px; width: 120px; border-radius: 3px; overflow: hidden; background: var(--line); }
.dist span { display: block; height: 100%; }
.ctable td:first-child { font-weight: 600; }
.ctable td:first-child i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .row, tbody tr.g { transition: background .12s; } }
.roletabs { margin-bottom: 2px; }
.roletabs a { display: inline-block; padding: 6px 14px; font-size: 13px; text-decoration: none; color: var(--fg); background: var(--surface); }
.roletabs a[aria-current="page"] { background: var(--accent); color: var(--bg); }
.sit { white-space: nowrap; }
.sit.hot { color: var(--accent); font-weight: 600; }
select.btn { padding-right: 8px; }
.lbctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lbctl label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ltable td.nm a { color: var(--fg); text-decoration: none; font-weight: 600; }
.ltable td.nm a:hover { color: var(--accent); }
.ltable td.nm .sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
.ltable tr.mine td.nm a::after { content: "•"; color: var(--accent); margin-left: 5px; }
.cons { font-size: 12px; color: var(--muted); }
.fact .s { font-size: 12px; color: var(--muted); }
/* Bigger screens: wider page, larger type, extra columns in the list. */
.xst { display: none; text-align: right; }
.xst .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; }
.xst .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (min-width: 900px) {
  body { font-size: 16px; }
  .wrap { max-width: 1180px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
  .brand { font-size: 36px; }
  h1 { font-size: 42px; }
  h2 { font-size: 26px; }
  .row { grid-template-columns: 2.4em minmax(0, 1fr) 150px 7em 5.5em 5.5em 5em; gap: 20px; padding: 14px 18px; }
  .xst { display: block; }
  .spark { width: 150px; height: 36px; }
  .who .sub { font-size: 14px; }
  .facts { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
  .fact .v { font-size: 30px; }
  table { font-size: 15px; }
  th, td { padding: 10px 12px; }
  .add { max-width: 560px; }
}
@media (min-width: 1500px) { .wrap { max-width: 1400px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#">Pitch<span>Score</span></a>
    <select class="btn season" id="seasonSel" aria-label="Season"></select>
    <span class="spacer"></span>
    <a class="btn" href="#" id="homelink">Following</a>
    <a class="btn" href="#leaders" id="leadlink">Leaders</a>
    <a class="btn" href="#compare" id="cmplink">Compare</a>
    <a class="btn" href="#formula" id="fmlink">Scoring</a>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </header>
  <div class="status" id="status" role="status"></div>
  <main id="view"></main>
  <footer>Data from the MLB Stats API. Regular season and postseason.</footer>
</div>

<script>
"use strict";
const API = "https://statsapi.mlb.com/api/v1";
const FIRST_SEASON = 2020;
/* The newest season starts showing in March. */
const CUR_SEASON = (() => { const d = new Date(); return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1; })();
const SEASONS = Array.from({ length: CUR_SEASON - FIRST_SEASON + 1 }, (_, i) => CUR_SEASON - i);
const DEFAULTS = {
  sp: [
    { id: 808967, name: "Yoshinobu Yamamoto" },
    { id: 837227, name: "Tatsuya Imai" },
    { id: 684007, name: "Shota Imanaga" },
    { id: 673540, name: "Kodai Senga" },
    { id: 608372, name: "Tomoyuki Sugano" },
  ],
  rp: [
    { id: 623352, name: "Josh Hader" },
    { id: 695243, name: "Mason Miller" },
    { id: 686973, name: "Louis Varland" },
    { id: 673513, name: "Yuki Matsui" },
  ],
};

/* ---------- scoring: starters (keep in sync with tools/build_leaders.py) ---------- */
const W = { base: 40, out: 2, k: 1, h: -2, bb: -3, hbp: -3, er: -4, solo: -6, multi: -8 };
function startParts(g) {
  return [
    [g.lr ? "Long relief (scored as a start)" : "Start", W.base],
    [`${g.outs} outs`, W.out * g.outs],
    [`${g.k} K`, W.k * g.k],
    [`${g.h} H`, W.h * g.h],
    [`${g.bb} BB`, W.bb * g.bb],
    [`${g.hbp} HBP`, W.hbp * g.hbp],
    [`${g.er} ER`, W.er * g.er],
    [`${g.solo} solo HR`, W.solo * g.solo],
    [`${g.multi} multi-run HR`, W.multi * g.multi],
  ];
}

/* ---------- scoring: relievers ---------- */
const RW = { base: 40, out: 3, k: 1, h: -2, bb: -3, hbp: -3, er: -6, solo: -8, multi: -10,
  irs: -3, irStr: 2, sv: 10, hld: 6, bs: -10, inn: 2, xi: 5, perfect: 8 };
const CLOSE = { 0: 8, 1: 8, 2: 5 };      // lead when they enter -> bonus
const lateInning = g => (g.sched || 9) - 2; // 7th in a 9-inning game, 5th in a 7-inning doubleheader game
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const leadTxt = l => l > 0 ? `up ${l}` : l === 0 ? "tied" : `down ${-l}`;
const sitTxt = g => g.inn ? `${ord(g.inn)}, ${leadTxt(g.lead)}` : "–";
const closeEntry = g => g.inn >= lateInning(g) && g.lead in CLOSE;
const isClean = g => g.r === 0 && g.irs === 0;
function reliefParts(g) {
  const extraInn = Math.max(0, Math.floor(g.outs / 3) - 1);
  const stranded = g.ir - g.irs;
  const perfect = g.outs >= 3 && g.h + g.bb + g.hbp === 0;
  return [
    [g.opener ? "Opener (scored as relief)" : "Relief appearance", RW.base],
    [`${g.outs} outs`, RW.out * g.outs],
    [`${g.k} K`, RW.k * g.k],
    [`${g.h} H`, RW.h * g.h],
    [`${g.bb} BB`, RW.bb * g.bb],
    [`${g.hbp} HBP`, RW.hbp * g.hbp],
    [`${g.er} ER`, RW.er * g.er],
    [`${g.solo} solo HR`, RW.solo * g.solo],
    [`${g.multi} multi-run HR`, RW.multi * g.multi],
    [`${g.irs} inherited runner${g.irs === 1 ? "" : "s"} scored`, RW.irs * g.irs],
    [`${stranded} inherited runner${stranded === 1 ? "" : "s"} stranded`, RW.irStr * stranded],
    ["Save", RW.sv * g.sv],
    ["Hold", RW.hld * g.hld],
    ["Blown save", RW.bs * g.bs],
    [`${extraInn} extra full inning${extraInn === 1 ? "" : "s"}`, RW.inn * extraInn],
    ["Pitched in extra innings", RW.xi * g.xi],
    ["No baserunners", perfect ? RW.perfect : 0],
    [`Close game: entered ${sitTxt(g)}, no runs scored`, closeEntry(g) && isClean(g) ? CLOSE[g.lead] : 0],
  ];
}
const total = parts => parts.reduce((s, p) => s + p[1], 0);

/* Starter tiers: all 4,858 MLB starts in the 2026 regular season (average start = 45). */
const TIERS = [
  { min: 85, name: "Elite", v: "--t-elite", share: "1%", ex: "8 IP, 2 H, 0 ER, 0 BB, 10 K" },
  { min: 70, name: "Great", v: "--t-great", share: "10%", ex: "7 IP, 3 H, 0 ER, 1 BB, 7 K" },
  { min: 55, name: "Good", v: "--t-good", share: "24%", ex: "6 IP, 4 H, 1 ER, 1 BB, 5 K" },
  { min: 40, name: "Average", v: "--t-avg", share: "30%", ex: "5 IP, 5 H, 2 ER, 2 BB, 4 K" },
  { min: 25, name: "Below Avg", v: "--t-below", share: "19%", ex: "5 IP, 5 H, 3 ER, 2 BB, 4 K" },
  { min: 10, name: "Poor", v: "--t-poor", share: "10%", ex: "4 IP, 7 H, 5 ER, 2 BB, 3 K" },
  { min: -Infinity, name: "Disastrous", v: "--t-dis", share: "6%", ex: "3.2 IP, 7 H, 7 ER, 2 BB, 3 K, 2 HR" },
];
/* Relief tiers: all 15,699 MLB relief outings in the 2026 regular season. */
const RTIERS = [
  { min: 80, name: "Elite", v: "--t-elite", share: "under 1%", ex: "Enters 9th up 1: 4-out save, perfect, 3 K (81)" },
  { min: 70, name: "Great", v: "--t-great", share: "6%", ex: "Enters 9th up 1: perfect, 2 K, save (77)" },
  { min: 60, name: "Good", v: "--t-good", share: "15%", ex: "Enters 9th up 1: 1 H, 1 K, save (66)" },
  { min: 45, name: "Average", v: "--t-avg", share: "46%", ex: "Perfect inning, 1 K, game not close (58)" },
  { min: 35, name: "Below Avg", v: "--t-below", share: "14%", ex: "1 IP, 1 H, 1 BB, 1 ER, 1 K (39)" },
  { min: 20, name: "Poor", v: "--t-poor", share: "11%", ex: "1 IP, 2 H, 1 BB, 2 ER, 1 K (31)" },
  { min: -Infinity, name: "Disastrous", v: "--t-dis", share: "7%", ex: "1 out, 3 H, 3 ER, solo HR (11)" },
];
/* Consistency = spread (standard deviation) of a pitcher's game scores. Cutoffs are the
   quartiles among qualified 2026 pitchers: the steadiest quarter, next quarter, and so on. */
const CONS = {
  sp: [17, 19, 21],
  rp: [14, 15.5, 17],
};
const CONS_NAMES = ["Very steady", "Steady", "Up and down", "Very up and down"];
const consName = (sd, role) => sd == null || isNaN(sd) ? "" : CONS_NAMES[CONS[role].filter(c => sd > c).length];

const ROLES = {
  sp: { key: "starts", T: TIERS, good: 55, roll: 5, store: "ps:pitchers", page: "p", cmp: "compare", lead: "leaders",
        title: "Starters", one: "start", many: "starts", rollTxt: "5-start average", label: "starter", min: s => s === 2020 ? 5 : 12 },
  rp: { key: "relief", T: RTIERS, good: 60, roll: 10, store: "ps:relievers", page: "r", cmp: "compare-rp", lead: "leaders-rp",
        title: "Relievers", one: "outing", many: "relief outings", rollTxt: "10-outing average", label: "reliever", min: s => s === 2020 ? 10 : 25 },
};
const tier = (s, T = TIERS) => T.find(t => s >= t.min);
const pill = (s, T) => { const t = tier(s, T); return `<span class="pill" style="--t:var(${t.v})">${t.name}</span>`; };
const tierColor = (s, T) => `var(${tier(s, T).v})`;

/* ---------- storage (best effort) ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

let SEASON = SEASONS.includes(load("ps:season", CUR_SEASON)) ? load("ps:season", CUR_SEASON) : CUR_SEASON;
const lists = { sp: load("ps:pitchers", null) || DEFAULTS.sp.slice(), rp: load("ps:relievers", null) || DEFAULTS.rp.slice() };
const hrCache = load("ps:hr", {});             // "gamePk:pitcherId" -> {solo, multi}
const ctxCache = load("ps:ctx", {});           // "gamePk:pitcherId" -> {solo, multi, inn, lead, xi, sched}
const logKey = () => "ps:logs3:" + SEASON;
let logCache = load(logKey(), {});             // pitcherId -> {name, team, starts:[...], relief:[...], at}
let teams = load("ps:teams", null);             // id -> abbreviation
try { for (const k of Object.keys(localStorage)) if (/^ps:logs2?:/.test(k)) localStorage.removeItem(k); } catch {}
function saveList(role) { save(ROLES[role].store, lists[role]); }
const allIds = () => [...new Map([...lists.sp, ...lists.rp].map(p => [p.id, p])).values()];
const followed = id => lists.sp.some(p => p.id === id) || lists.rp.some(p => p.id === id);
/* Only followed pitchers are saved on the device; anyone opened from Leaders stays in memory. */
function saveLogs() {
  const keep = {};
  for (const [id, rec] of Object.entries(logCache)) if (followed(Number(id))) keep[id] = rec;
  save(logKey(), keep);
}

/* ---------- fetching ---------- */
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("MLB data request failed (" + r.status + ")");
  return r.json();
}
async function loadTeams() {
  if (teams) return;
  const d = await getJSON(`${API}/teams?sportId=1&fields=teams,id,abbreviation`);
  teams = {};
  for (const t of d.teams) teams[t.id] = t.abbreviation;
  save("ps:teams", teams);
}
function abbr(t) { return (teams && teams[t.id]) || t.abbreviation || (t.name || "").split(" ").pop(); }
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

function fixHR(solo, multi, total) {
  if (solo + multi !== total) { solo = Math.min(solo, total); multi = total - solo; }
  return { solo, multi };
}
async function hrSplit(g, pid) {
  const key = g.pk + ":" + pid;
  if (hrCache[key]) return hrCache[key];
  const d = await getJSON(`${API}/game/${g.pk}/playByPlay?fields=allPlays,result,eventType,rbi,matchup,pitcher,id`);
  let solo = 0, multi = 0;
  for (const p of d.allPlays || []) {
    if (p.matchup && p.matchup.pitcher && p.matchup.pitcher.id === pid && p.result && p.result.eventType === "home_run") {
      if (p.result.rbi > 1) multi++; else solo++;
    }
  }
  const v = fixHR(solo, multi, g.hr);
  if (g.date < todayISO()) { hrCache[key] = v; save("ps:hr", hrCache); }
  return v;
}
/* One play-by-play read per relief outing: the inning and score when they came in,
   whether they pitched in extra innings, and which home runs were solo.
   2020–21 had 7-inning doubleheader games, so those seasons also check the scheduled length. */
async function reliefCtx(g, pid) {
  const key = g.pk + ":" + pid;
  if (ctxCache[key]) return { sched: 9, ...ctxCache[key] };
  const [d, ls] = await Promise.all([
    getJSON(`${API}/game/${g.pk}/playByPlay?fields=allPlays,result,eventType,rbi,awayScore,homeScore,about,inning,isTopInning,matchup,pitcher,id`),
    SEASON <= 2021 ? getJSON(`${API}/game/${g.pk}/linescore?fields=scheduledInnings`) : Promise.resolve({}),
  ]);
  const sched = ls.scheduledInnings || 9;
  let prev = [0, 0], inn = 0, lead = null, maxInn = 0, solo = 0, multi = 0;
  for (const p of d.allPlays || []) {
    const r = p.result || {};
    if (p.matchup && p.matchup.pitcher && p.matchup.pitcher.id === pid) {
      if (!inn) {
        inn = p.about.inning;
        const [a, h] = prev;
        lead = p.about.isTopInning ? h - a : a - h;   // top of the inning: home team is pitching
      }
      maxInn = Math.max(maxInn, p.about.inning);
      if (r.eventType === "home_run") { if (r.rbi > 1) multi++; else solo++; }
    }
    prev = [r.awayScore ?? prev[0], r.homeScore ?? prev[1]];
  }
  const v = { ...fixHR(solo, multi, g.hr), inn, lead, xi: maxInn > sched ? 1 : 0, sched };
  if (g.date < todayISO()) { ctxCache[key] = v; save("ps:ctx", ctxCache); }
  return v;
}

async function pool(items, n, fn) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const it = items[i++]; await fn(it); }
  });
  await Promise.all(workers);
}

async function fetchPitcher(pid) {
  const season = SEASON;
  const url = gt => `${API}/people/${pid}/stats?stats=gameLog&group=pitching&season=${season}&gameType=${gt}`;
  const [reg, post] = await Promise.all([getJSON(url("R")), getJSON(url("P"))]);
  const splits = [];
  for (const d of [reg, post]) if (d.stats && d.stats[0]) splits.push(...d.stats[0].splits);
  let team = "", name = "";
  const all = [];
  for (const s of splits) {
    const st = s.stat;
    team = s.team ? abbr(s.team) : team;
    name = (s.player && s.player.fullName) || name;
    all.push({
      pk: s.game.gamePk, date: s.date, post: s.gameType !== "R", gs: st.gamesStarted === 1,
      opp: abbr(s.opponent), home: s.isHome, w: st.wins || 0, l: st.losses || 0,
      ip: st.inningsPitched, outs: st.outs, h: st.hits, bb: st.baseOnBalls, hbp: st.hitBatsmen,
      er: st.earnedRuns, r: st.runs, k: st.strikeOuts, hr: st.homeRuns, np: st.numberOfPitches || 0,
      ir: st.inheritedRunners || 0, irs: st.inheritedRunnersScored || 0,
      sv: st.saves || 0, hld: st.holds || 0, bs: st.blownSaves || 0,
      solo: 0, multi: 0, hrKnown: st.homeRuns === 0,
    });
  }
  /* Openers: a start under 2 IP and under 40 pitches by someone who relieves more than he starts
     is scored as relief. Long relief: 4+ IP from the bullpen with no save or hold is scored as a start. */
  const nStart = all.filter(g => g.gs).length;
  const reliever = all.length - nStart > nStart;
  const starts = [], relief = [];
  for (const g of all) {
    if (g.gs && !(reliever && g.outs < 6 && g.np < 40)) {
      g.dec = g.w ? "W" : g.l ? "L" : "ND";
      starts.push(g);
    } else if (!g.gs && g.outs >= 12 && !g.sv && !g.hld) {
      g.lr = true;
      g.dec = g.w ? "W" : g.l ? "L" : "ND";
      starts.push(g);
    } else {
      g.opener = g.gs;
      Object.assign(g, { inn: 0, lead: null, xi: 0, sched: 9, ctxKnown: false });
      g.dec = [g.bs ? "BS" : "", g.sv ? "SV" : "", g.hld ? "HLD" : "", g.w ? "W" : "", g.l ? "L" : ""].filter(Boolean).join(", ") || "–";
      relief.push(g);
    }
  }
  starts.sort((a, b) => a.date.localeCompare(b.date));
  relief.sort((a, b) => a.date.localeCompare(b.date));
  await Promise.all([
    pool(starts.filter(g => g.hr > 0), 3, async g => {
      try { Object.assign(g, await hrSplit(g, pid)); g.hrKnown = true; }
      catch { g.solo = 0; g.multi = g.hr; }
    }),
    pool(relief, 4, async g => {
      try { Object.assign(g, await reliefCtx(g, pid)); g.hrKnown = true; g.ctxKnown = true; }
      catch { g.solo = 0; g.multi = g.hr; }
    }),
  ]);
  for (const g of starts) g.score = total(startParts(g));
  for (const g of relief) g.score = total(reliefParts(g));
  const rec = { name, team, starts, relief, at: Date.now() };
  if (season !== SEASON) return rec;       // season was switched while loading
  logCache[pid] = rec;
  saveLogs();
  return rec;
}

/* ---------- stats ---------- */
const $ = s => document.querySelector(s);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
function median(a) { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
const sdev = a => { if (a.length < 2) return NaN; const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
const fmt1 = x => x == null || isNaN(x) ? "–" : x.toFixed(1);
function fmtDate(d) { const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function setStatus(msg, err) { const el = $("#status"); el.textContent = msg || ""; el.classList.toggle("err", !!err); }
const games = (pid, role) => (logCache[pid] && logCache[pid][ROLES[role].key]) || [];
const regOf = gs => gs.filter(g => !g.post);
const postOf = gs => gs.filter(g => g.post);
const scoresOf = gs => gs.map(g => g.score);
const maxOr = a => a.length ? Math.max(...a) : "–";
const minOr = a => a.length ? Math.min(...a) : "–";
/* Pitch efficiency: pitches thrown per inning (3 outs). Doesn't affect the score. */
const ppi = gs => { const o = gs.reduce((a, g) => a + g.outs, 0), n = gs.reduce((a, g) => a + g.np, 0); return o && n ? n / (o / 3) : NaN; };
const consHTML = (sd, role) => isNaN(sd) || sd == null ? "–" : `±${sd.toFixed(1)} <span class="cons">${consName(sd, role)}</span>`;

function roleTabs(role, hashFor) {
  return `<nav class="seg roletabs" aria-label="Pitcher type">${["sp", "rp"].map(r =>
    `<a href="#${hashFor(r)}" ${r === role ? 'aria-current="page"' : ""}>${ROLES[r].title}</a>`).join("")}</nav>`;
}

function sparkline(scores) {
  if (!scores.length) return `<span class="spark"></span>`;
  const w = 96, h = 30, lo = Math.min(0, ...scores), hi = Math.max(100, ...scores);
  const x = i => scores.length === 1 ? w / 2 : 2 + i * (w - 4) / (scores.length - 1);
  const y = v => h - 2 - (v - lo) / (hi - lo) * (h - 4);
  const pts = scores.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last = scores.length - 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${y(50)}" y2="${y(50)}" stroke="var(--line)" stroke-dasharray="2 2"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(scores[last])}" r="2.5" fill="var(--accent)"/></svg>`;
}

/* Horizontal lines at each tier cutoff, labelled on the left. */
function tierGrid(y, lo, hi, x1, x2, T) {
  let s = "";
  const marks = [0, ...T.map(t => t.min).filter(m => isFinite(m) && m !== 0)];
  for (const m of marks) {
    if (m < lo || m > hi) continue;
    s += `<line x1="${x1}" x2="${x2}" y1="${y(m)}" y2="${y(m)}" stroke="var(--line)" ${m === 0 ? "" : 'stroke-dasharray="3 3"'}/>`;
    s += `<text x="${x1 - 6}" y="${y(m) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${m}</text>`;
  }
  return s;
}

/* Charts are drawn at the screen's real width so text stays the same size on every device. */
const chartW = () => Math.round(Math.max(300, Math.min(1400, ($("#view").clientWidth || 700) - 26)));
function chart(gs, role) {
  const T = ROLES[role].T;
  const n = gs.length, W2 = chartW(), H = Math.round(Math.min(300, Math.max(190, W2 * 0.3))), padL = 30, padR = 8, padT = 10, padB = 22;
  const scores = gs.map(g => g.score);
  const lo = Math.min(0, Math.floor(Math.min(...scores) / 25) * 25);
  const hi = Math.max(100, Math.ceil(Math.max(...scores) / 25) * 25);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const bw = (W2 - padL - padR) / n;
  let s = `<svg viewBox="0 0 ${W2} ${H}" role="img" aria-label="Score for each ${ROLES[role].one} this season">`;
  s += tierGrid(y, lo, hi, padL, W2 - padR, T);
  gs.forEach((g, i) => {
    const x = padL + i * bw + bw * 0.15, w = bw * 0.7;
    const top = y(Math.max(0, g.score)), bot = y(Math.min(0, g.score));
    s += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" rx="${Math.min(2, w / 3).toFixed(1)}" fill="${tierColor(g.score, T)}"><title>${esc(fmtDate(g.date))} vs ${esc(g.opp)}: ${g.score} (${tier(g.score, T).name})</title></rect>`;
    if (g.post) s += `<circle cx="${(x + w / 2).toFixed(1)}" cy="${(top - 6).toFixed(1)}" r="3" fill="var(--post)"/>`;
  });
  const avg = mean(scoresOf(regOf(gs))), pAvg = mean(scoresOf(postOf(gs)));
  if (!isNaN(avg)) {
    s += `<line x1="${padL}" x2="${W2 - padR}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--fg)" stroke-width="1.2"/>`;
    s += `<text x="${W2 - padR}" y="${y(avg) - 5}" text-anchor="end" font-size="11" fill="var(--fg)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">season avg ${fmt1(avg)}</text>`;
  }
  if (!isNaN(pAvg)) {
    s += `<line x1="${padL}" x2="${W2 - padR}" y1="${y(pAvg)}" y2="${y(pAvg)}" stroke="var(--post)" stroke-width="1.2" stroke-dasharray="5 3"/>`;
    const ly = pAvg > avg || isNaN(avg) ? y(pAvg) - 5 : y(pAvg) + 13;
    s += `<text x="${W2 - padR}" y="${ly}" text-anchor="end" font-size="11" fill="var(--post)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">postseason avg ${fmt1(pAvg)}</text>`;
  }
  s += `<text x="${padL}" y="${H - 6}" font-size="11" fill="var(--muted)">${esc(fmtDate(gs[0].date))}</text>`;
  s += `<text x="${W2 - padR}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtDate(gs[n - 1].date))}</text>`;
  return s + "</svg>";
}

/* ---------- views ---------- */
let curRole = "sp";
function viewHome(role) {
  const R = ROLES[role];
  const rows = lists[role].map(p => {
    const rec = logCache[p.id];
    const gs = games(p.id, role);
    const sc = gs.map(g => g.score), post = scoresOf(postOf(gs));
    return { p, rec, gs, sc, post, avg: mean(scoresOf(regOf(gs))) };
  }).sort((a, b) => (isNaN(b.avg) ? -1e9 : b.avg) - (isNaN(a.avg) ? -1e9 : a.avg));

  let html = `<section style="display:flex;flex-direction:column;gap:12px">
    ${roleTabs(role, r => r === "sp" ? "" : "rp")}
    <h1>${R.title} you follow</h1>
    <div class="board">`;
  if (!rows.length) html += `<div class="empty">No ${R.title.toLowerCase()} yet. Search for one below, or find one in Leaders.</div>`;
  rows.forEach((r, i) => {
    const last = r.gs.length ? r.gs[r.gs.length - 1] : null;
    const nReg = r.sc.length - r.post.length;
    const sub = r.rec && !r.sc.length ? `No ${SEASON} MLB ${R.many}` : r.rec ? `${esc(r.rec.team || "")} · ${nReg} ${nReg === 1 ? R.one : R.many}${r.post.length ? ` · <span style="color:var(--post)">postseason ${fmt1(mean(r.post))} (${r.post.length})</span>` : ""}${last ? ` · last ${last.score} (${esc(fmtDate(last.date))})` : ""}` : "Loading…";
    html += `<a class="row" href="#${R.page}-${r.p.id}">
      <span class="rank num">${isNaN(r.avg) ? "–" : i + 1}</span>
      <span class="who"><div class="nm">${esc(r.p.name)}</div><div class="sub num">${sub}</div></span>
      ${sparkline(r.sc)}
      <span class="xst"><div class="v num">${isNaN(sdev(scoresOf(regOf(r.gs)))) ? "–" : "±" + sdev(scoresOf(regOf(r.gs))).toFixed(1)}</div><div class="k">${consName(sdev(scoresOf(regOf(r.gs))), role) || "Consistency"}</div></span>
      <span class="xst"><div class="v num">${fmt1(ppi(regOf(r.gs)))}</div><div class="k">Pitch / inn</div></span>
      <span class="xst"><div class="v num">${nReg ? Math.round(100 * scoresOf(regOf(r.gs)).filter(v => v >= R.good).length / nReg) + "%" : "–"}</div><div class="k">Good+</div></span>
      <span class="avg"><div class="v num">${fmt1(r.avg)}</div><div class="k">${isNaN(r.avg) ? "avg" : `<span style="color:${tierColor(r.avg, R.T)}">${tier(r.avg, R.T).name}</span>`}</div></span>
    </a>`;
  });
  html += `</div></section>
  <section class="add" style="display:flex;flex-direction:column;gap:6px">
    <label class="label" for="q">Add a ${R.label}</label>
    <input id="q" type="search" placeholder="Search MLB pitchers by name" autocomplete="off">
    <ul class="results" id="results" hidden></ul>
  </section>`;
  $("#view").innerHTML = html;
  let timer;
  $("#q").addEventListener("input", e => { clearTimeout(timer); const q = e.target.value.trim(); timer = setTimeout(() => search(q, role), 300); });
}

async function follow(role, id, name) {
  if (lists[role].some(x => x.id === id)) return;
  lists[role].push({ id, name });
  saveList(role);
  if (logCache[id]) { saveLogs(); return; }
  setStatus(`Loading ${name}…`);
  try { await fetchPitcher(id); setStatus(""); } catch (e) { setStatus(e.message, true); }
}

async function search(q, role) {
  const ul = $("#results");
  if (!ul) return;
  if (q.length < 2) { ul.hidden = true; return; }
  try {
    const d = await getJSON(`${API}/people/search?names=${encodeURIComponent(q)}&sportIds=1&hydrate=currentTeam`);
    const ps = (d.people || []).filter(p => p.primaryPosition && ["P", "TWP"].includes(p.primaryPosition.abbreviation));
    if (!ps.length) { ul.innerHTML = `<li><span class="nm sub">No MLB pitchers match "${esc(q)}".</span></li>`; ul.hidden = false; return; }
    ul.innerHTML = ps.slice(0, 8).map(p => {
      const have = lists[role].some(x => x.id === p.id);
      const team = p.currentTeam && p.currentTeam.id ? abbr(p.currentTeam) : (p.active ? "" : "inactive");
      return `<li><span class="nm">${esc(p.fullName)} <span class="sub">${esc(team)}</span></span>
        ${have ? `<span class="sub">Following</span>` : `<button class="btn primary" type="button" data-id="${p.id}" data-name="${esc(p.fullName)}">Follow</button>`}</li>`;
    }).join("");
    ul.hidden = false;
    ul.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", async () => {
      const p = follow(role, Number(b.dataset.id), b.dataset.name);
      viewHome(role);
      await p;
      route();
    }));
  } catch (e) { setStatus("Search failed. Check your connection and try again.", true); }
}

function breakdownHTML(parts, score) {
  return `<div class="breakdown">${parts.filter((pt, i) => i === 0 || pt[1] !== 0)
    .map(([k, v]) => `<div><span>${esc(k)}</span><span class="${v >= 0 ? "p" : "m"}">${v > 0 ? "+" : ""}${v}</span></div>`).join("")
    }<div class="tot"><span>Score</span><span>${score}</span></div></div>`;
}
const note = t => `<div class="note" style="margin-top:6px">${t}</div>`;
function hrCell(g) {
  return g.hr ? `${g.hr}<span class="note"> (${[g.solo ? g.solo + " solo" : "", g.multi ? g.multi + " multi" : ""].filter(Boolean).join(", ")}${g.hrKnown ? "" : "?"})</span>` : "0";
}
const pCell = g => g.np ? `${g.np}<span class="note"> (${fmt1(ppi([g]))}/inn)</span>` : "–";

const loadingIds = new Set();
function viewPitcher(pid, role) {
  const R = ROLES[role], T = R.T;
  const rec = logCache[pid];
  const fol = lists[role].find(x => x.id === pid);
  const back = `<div class="crumbs"><a href="#${role === "sp" ? "" : "rp"}">← All ${R.title.toLowerCase()}</a> · <a href="#${R.lead}">Leaders</a></div>`;
  if (!rec) {
    $("#view").innerHTML = `${back}<div class="empty">Loading…</div>`;
    if (!loadingIds.has(pid)) {
      loadingIds.add(pid);
      fetchPitcher(pid).then(() => { loadingIds.delete(pid); if (location.hash === `#${R.page}-${pid}`) route(); })
        .catch(e => { loadingIds.delete(pid); setStatus(e.message, true); });
    }
    return;
  }
  const name = fol ? fol.name : rec.name;
  const gs = rec[R.key] || [];
  let html = `<section style="display:flex;flex-direction:column;gap:16px">${back}
    <div><h1>${esc(name)}</h1><div class="sub" style="color:var(--muted)">${esc(rec.team)} · ${SEASON} ${R.many}</div></div>`;
  if (!fol) html += `<div><button class="btn primary" id="followme" type="button">Follow ${esc(name)} as a ${R.label}</button></div>`;
  if (!gs.length) {
    html += `<div class="empty">No ${SEASON} MLB ${R.many}.${(rec[role === "sp" ? "relief" : "starts"] || []).length ? ` Try the ${role === "sp" ? "Relievers" : "Starters"} view.` : ""}</div>`;
  } else {
    const facts = (label, part) => {
      const ps = scoresOf(part);
      const svh = role === "rp"
        ? `<div class="fact"><div class="label">Saves / holds</div><div class="v num">${part.reduce((a, g) => a + g.sv, 0)} / ${part.reduce((a, g) => a + g.hld, 0)}</div></div>` : "";
      const sd = sdev(ps);
      return `<h2 style="margin:0">${label}</h2><div class="facts">
      <div class="fact"><div class="label">${role === "sp" ? "Starts" : "Outings"}</div><div class="v num">${part.length}</div></div>
      <div class="fact"><div class="label">Average</div><div class="v num">${fmt1(mean(ps))}</div></div>
      <div class="fact"><div class="label">Median</div><div class="v num">${fmt1(median(ps))}</div></div>
      <div class="fact"><div class="label">Best</div><div class="v num">${maxOr(ps)}</div></div>
      <div class="fact"><div class="label">Worst</div><div class="v num">${minOr(ps)}</div></div>
      <div class="fact"><div class="label">Good or better</div><div class="v num">${ps.length ? Math.round(100 * ps.filter(v => v >= R.good).length / ps.length) + "%" : "–"}</div></div>
      <div class="fact"><div class="label">Consistency</div><div class="v num">${isNaN(sd) ? "–" : "±" + sd.toFixed(1)}</div><div class="s">${consName(sd, role)}</div></div>
      <div class="fact"><div class="label">Pitches / inning</div><div class="v num">${fmt1(ppi(part))}</div></div>
      ${svh}
    </div>`;
    };
    const reg = regOf(gs), post = postOf(gs);
    html += facts("Regular season", reg) + (post.length ? facts(`<span style="color:var(--post)">Postseason</span>`, post) : "");
    html += `<div class="note">Consistency is how far a typical ${R.one} lands from the average: lower is steadier. Pitches per inning shows efficiency and doesn't change the score.</div>
    <div class="chartbox">${chart(gs, role)}
      <div class="legend">${T.map(t => `<span><i style="background:var(${t.v})"></i>${t.name}</span>`).join("")}${gs.some(g => g.post) ? `<span><i style="background:var(--post);border-radius:50%"></i>Postseason</span>` : ""}</div>
    </div>
    <div class="note">Tap a${role === "sp" ? " start" : "n outing"} to see where its points came from.</div>
    <div class="tablewrap"><table>`;
    if (role === "sp") {
      html += `<thead><tr><th>Date</th><th>Opp</th><th>Dec</th><th>IP</th><th>H</th><th>BB</th><th>HBP</th><th>ER</th><th>K</th><th>HR</th><th>Pitches</th><th>Score</th></tr></thead><tbody>`;
      gs.slice().reverse().forEach(g => {
        html += `<tr class="g" tabindex="0" data-pk="${g.pk}"><td>${esc(fmtDate(g.date))}${g.post ? '<span class="tag">POST</span>' : ""}${g.lr ? '<span class="tag">LONG RELIEF</span>' : ""}</td>
          <td>${g.home ? "" : "@"}${esc(g.opp)}</td><td>${g.dec}</td><td>${esc(g.ip)}</td><td>${g.h}</td><td>${g.bb}</td><td>${g.hbp}</td><td>${g.er}</td><td>${g.k}</td><td>${hrCell(g)}</td><td>${pCell(g)}</td><td class="sc">${g.score}${pill(g.score, T)}</td></tr>
          <tr class="bd" data-for="${g.pk}" hidden><td colspan="12">${breakdownHTML(startParts(g), g.score)}${
            g.lr ? note("Came in from the bullpen and went 4+ innings with no save or hold, so it's scored as a start.") : ""}${
            g.hrKnown ? "" : note("Couldn't check this game's play-by-play, so every home run is counted as multi-run for now.")}${
            g.er !== g.r ? note(`${g.r - g.er} unearned run${g.r - g.er > 1 ? "s" : ""} not counted.`) : ""}</td></tr>`;
      });
    } else {
      html += `<thead><tr><th>Date</th><th>Opp</th><th>Entered</th><th>Result</th><th>IP</th><th>H</th><th>BB</th><th>ER</th><th>K</th><th>HR</th><th>IR</th><th>Pitches</th><th>Score</th></tr></thead><tbody>`;
      gs.slice().reverse().forEach(g => {
        const hot = closeEntry(g) && isClean(g);
        html += `<tr class="g" tabindex="0" data-pk="${g.pk}"><td>${esc(fmtDate(g.date))}${g.post ? '<span class="tag">POST</span>' : ""}${g.opener ? '<span class="tag">OPENER</span>' : ""}${g.xi ? '<span class="tag">EXTRAS</span>' : ""}</td>
          <td>${g.home ? "" : "@"}${esc(g.opp)}</td><td class="sit${hot ? " hot" : ""}">${esc(sitTxt(g))}</td><td>${g.dec}</td><td>${esc(g.ip)}</td><td>${g.h + (g.hbp ? `<span class="note"> +${g.hbp} HBP</span>` : "")}</td><td>${g.bb}</td><td>${g.er}</td><td>${g.k}</td><td>${hrCell(g)}</td><td>${g.ir ? `${g.irs}/${g.ir}` : "–"}</td><td>${pCell(g)}</td><td class="sc">${g.score}${pill(g.score, T)}</td></tr>
          <tr class="bd" data-for="${g.pk}" hidden><td colspan="13">${breakdownHTML(reliefParts(g), g.score)}${
            g.opener ? note("Started the game but went under 2 innings and under 40 pitches, and he relieves more than he starts, so it's scored as a relief outing.") : ""}${
            g.sched && g.sched !== 9 ? note(`A ${g.sched}-inning game, so the close-game bonus starts in the ${ord(lateInning(g))} and extra innings start in the ${ord(g.sched + 1)}.`) : ""}${
            closeEntry(g) && !isClean(g) ? note(`Came in ${sitTxt(g)}, but a run scored while pitching, so no close-game bonus.`) : ""}${
            g.ctxKnown ? "" : note("Couldn't check this game's play-by-play, so the entry situation and extra innings aren't counted yet, and every home run is counted as multi-run.")}${
            g.er !== g.r ? note(`${g.r - g.er} unearned run${g.r - g.er > 1 ? "s" : ""} not counted.`) : ""}</td></tr>`;
      });
    }
    html += `</tbody></table></div>`;
    if (role === "rp") {
      const lr = (rec.starts || []).filter(g => g.lr).length;
      if (lr) html += `<div class="note">${lr} long relief outing${lr > 1 ? "s" : ""} (4+ innings, no save or hold) ${lr > 1 ? "are" : "is"} scored as a start and not shown here.</div>`;
      html += `<div class="note">IR = inherited runners who scored / inherited runners. Entered = inning and score when they came in, from their team's side.</div>`;
    } else {
      const op = (rec.relief || []).filter(g => g.opener).length;
      if (op) html += `<div class="note">${op} opener start${op > 1 ? "s" : ""} (under 2 innings, under 40 pitches) ${op > 1 ? "are" : "is"} scored as relief and not shown here.</div>`;
    }
  }
  if (fol) html += `<div><button class="btn danger" id="unfollow" type="button">Stop following ${esc(name)} as a ${R.label}</button></div>`;
  $("#view").innerHTML = html + `</section>`;
  document.querySelectorAll("tr.g").forEach(tr => {
    const toggle = () => { const bd = document.querySelector(`tr.bd[data-for="${tr.dataset.pk}"]`); bd.hidden = !bd.hidden; };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
  const fb = $("#followme");
  if (fb) fb.addEventListener("click", async () => { await follow(role, pid, name); route(); });
  const un = $("#unfollow");
  if (un) un.addEventListener("click", () => {
    if (un.dataset.confirm) {
      lists[role] = lists[role].filter(x => x.id !== pid); saveList(role); saveLogs(); location.hash = role === "sp" ? "" : "rp"; route();
    } else { un.dataset.confirm = "1"; un.textContent = `Tap again to stop following ${name}`; }
  });
}

/* ---------- leaderboard ---------- */
const leaderData = {};   // season -> parsed data/leaders-<season>.json
let lbSort = load("ps:lbsort", "avg"), lbAll = false;
async function getLeaders(season) {
  if (leaderData[season]) return leaderData[season];
  const r = await fetch(`data/leaders-${season}.json?v=${season === CUR_SEASON ? todayISO() : "1"}`);
  if (!r.ok) throw new Error("missing");
  return (leaderData[season] = await r.json());
}
const SORTS = {
  avg: { label: "Average", key: r => r.avg, asc: false },
  cons: { label: "Most consistent", key: r => r.sd, asc: true },
  ppi: { label: "Fewest pitches / inning", key: r => r.ppi, asc: true },
  pavg: { label: "Postseason average", key: r => r.pavg, asc: false },
  good: { label: "Good or better %", key: r => r.good, asc: false },
};
async function viewLeaders(role) {
  const R = ROLES[role], T = R.T, season = SEASON;
  const head = `<section style="display:flex;flex-direction:column;gap:14px">
    ${roleTabs(role, r => ROLES[r].lead)}
    <h1>${season} ${R.title.toLowerCase()} leaderboard</h1>`;
  $("#view").innerHTML = head + `<div class="empty">Loading…</div></section>`;
  let d;
  try { d = await getLeaders(season); }
  catch { if (SEASON === season) $("#view").innerHTML = head + `<div class="empty">The ${season} leaderboard isn't available yet.</div></section>`; return; }
  if (SEASON !== season || location.hash.slice(1) !== R.lead) return;
  const min = R.min(season);
  const S = SORTS[lbSort] || SORTS.avg;
  let rows = d[role].filter(r => lbAll || r.n >= min);
  if (lbSort === "pavg") rows = d[role].filter(r => r.pn > 0);
  rows = rows.filter(r => S.key(r) != null).sort((a, b) => S.asc ? S.key(a) - S.key(b) : S.key(b) - S.key(a));
  let html = head + `<div class="lbctl">
      <label>Sort by <select class="btn" id="lbsort">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}" ${k === lbSort ? "selected" : ""}>${s.label}</option>`).join("")}</select></label>
      <label><input type="checkbox" id="lball" ${lbAll ? "checked" : ""}> Include pitchers under ${min} ${R.many}</label>
    </div>
    <div class="note">${lbSort === "pavg" ? `Every pitcher with a postseason ${R.one}.` : `${lbAll ? "Everyone" : `Pitchers with ${min}+ regular-season ${R.many}`}.`} Averages are regular season only. Tap a name for every ${R.one}. Updated ${esc(d.built.slice(0, 10))}.</div>
    <div class="tablewrap"><table class="ctable ltable">
      <thead><tr><th>#</th><th>Pitcher</th><th>${role === "sp" ? "GS" : "G"}</th><th>Avg</th><th>Post</th><th>Consistency</th><th>P/inn</th><th>Good+</th>${role === "rp" ? "<th>SV</th><th>HLD</th>" : ""}</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    html += `<tr class="g${followed(r.id) ? " mine" : ""}" style="cursor:default"><td class="num">${i + 1}</td>
      <td class="nm"><a href="#${R.page}-${r.id}">${esc(r.name)}</a><span class="sub">${esc(r.team)}</span></td>
      <td>${r.n}</td><td>${r.avg == null ? "–" : `${fmt1(r.avg)} ${pill(r.avg, T)}`}</td>
      <td>${r.pn ? `${fmt1(r.pavg)} <span class="note">(${r.pn})</span>` : "–"}</td>
      <td>${consHTML(r.sd, role)}</td><td>${fmt1(r.ppi)}</td><td>${r.good == null ? "–" : r.good + "%"}</td>
      ${role === "rp" ? `<td>${r.sv}</td><td>${r.hld}</td>` : ""}</tr>`;
  });
  if (!rows.length) html += `<tr><td colspan="10" class="empty">No pitchers to show.</td></tr>`;
  html += `</tbody></table></div><div class="note">A dot after a name means you follow him.</div></section>`;
  $("#view").innerHTML = html;
  $("#lbsort").addEventListener("change", e => { lbSort = e.target.value; save("ps:lbsort", lbSort); viewLeaders(role); });
  $("#lball").addEventListener("change", e => { lbAll = e.target.checked; viewLeaders(role); });
}

function tierTable(T, noun) {
  return `<div class="tiertable">${T.map((t, i) => `<div><span class="pill" style="--t:var(${t.v})">${t.name}</span><span class="num">${isFinite(t.min) ? (i === 0 ? t.min + "+" : t.min + "–" + (T[i - 1].min - 1)) : "under " + T[i - 1].min}</span><span class="ex">${t.ex} · ${t.share} of ${noun}</span></div>`).join("")}</div>`;
}
function weightsGrid(rows) {
  return `<div class="weights">${rows.map(([k, v]) => `<div><span>${k}</span><span class="num">${v}</span></div>`).join("")}</div>`;
}
function viewFormula() {
  const sRows = [
    ["Starting value", "+40"], ["Each out", "+2"], ["Each strikeout", "+1"], ["Each hit", "−2"],
    ["Each walk", "−3"], ["Each hit batter", "−3"], ["Each earned run", "−4"],
    ["Solo home run (extra)", "−6"], ["Multi-run home run (extra)", "−8"], ["Unearned runs", "0"],
  ];
  const rRows = [
    ["Starting value", "+40"], ["Each out", "+3"], ["Each strikeout", "+1"], ["Each hit", "−2"],
    ["Each walk", "−3"], ["Each hit batter", "−3"], ["Each earned run", "−6"],
    ["Solo home run (extra)", "−8"], ["Multi-run home run (extra)", "−10"],
    ["Inherited runner scores", "−3"], ["Inherited runner stranded", "+2"],
    ["Save", "+10"], ["Hold", "+6"], ["Blown save", "−10"],
    ["Each full inning after the first", "+2"], ["Pitched in extra innings", "+5"],
    ["No baserunners (1+ inning)", "+8"], ["Unearned runs", "0"],
  ];
  const cRows = [["Enters tied", "+8"], ["Enters up 1", "+8"], ["Enters up 2", "+5"]];
  const cons = role => CONS_NAMES.map((n, i) => [n, i === 0 ? `±${CONS[role][0]} or less` : i === 3 ? `over ±${CONS[role][2]}` : `±${CONS[role][i - 1]}–${CONS[role][i]}`]);
  $("#view").innerHTML = `<section style="display:flex;flex-direction:column;gap:16px">
    <div class="crumbs"><a href="#">← All pitchers</a></div>
    <h1>How a start is scored</h1>
    <div class="formula">
      <code>40 + 2×Outs + K − 2×H − 3×BB − 3×HBP − 4×ER − 6×Solo HR − 8×Multi-run HR</code>
      ${weightsGrid(sRows)}
      <div class="note">A strikeout counts as an out too, so it's worth +3 in total. A home run also costs the hit and its earned runs: a solo shot is −12 in all. A perfect game with 27 strikeouts scores 121.</div>
      <div class="note">Postseason starts are included and marked. A relief outing of 4+ innings with no save or hold is scored as a start too. An opener (a start under 2 innings and under 40 pitches, by a pitcher who relieves more than he starts) is scored as relief instead.</div>
    </div>
    <h2>Starter tiers</h2>
    <div class="formula">${tierTable(TIERS, "starts")}
      <div class="note">Set from all 4,858 MLB starts in the 2026 regular season. The average start scored 45. The same tiers are used for every season.</div>
    </div>
    <h1 style="margin-top:12px">How a relief outing is scored</h1>
    <div class="formula">
      <code>40 + 3×Outs + K − 2×H − 3×BB − 3×HBP − 6×ER − 8×Solo HR − 10×Multi-run HR − 3×IR scored + 2×IR stranded + 10 SV + 6 HLD − 10 BS + situation bonuses</code>
      ${weightsGrid(rRows)}
      <h3 style="margin:6px 0 0">Close-game bonus</h3>
      ${weightsGrid(cRows)}
      <div class="note">Only when they come in during the 7th inning or later, and only if no runs score while they pitch, including runners they inherited. A save from up 3 still gets the +10 save points, just no close-game bonus. In 7-inning doubleheader games (2020–21) the bonus starts in the 5th and extra innings start in the 8th.</div>
      <div class="note">Runs and outs weigh more than for a starter because a reliever has fewer outs to make up for a mistake. A perfect save in the 9th up 1 with 2 K scores 77.</div>
    </div>
    <h2>Relief tiers</h2>
    <div class="formula">${tierTable(RTIERS, "relief outings")}
      <div class="note">Set from all 15,699 MLB relief outings in the 2026 regular season.</div>
    </div>
    <h1 style="margin-top:12px">Other stats</h1>
    <div class="formula">
      <div><b>Consistency</b> is the spread of a pitcher's scores (standard deviation): roughly how far a typical game lands from his average. Two pitchers can both average 55, one always between 45 and 65 (about ±7) and one bouncing between 20 and 90 (about ±25). Lower is steadier.</div>
      <h3 style="margin:4px 0 0">Starters</h3>${weightsGrid(cons("sp"))}
      <h3 style="margin:4px 0 0">Relievers</h3>${weightsGrid(cons("rp"))}
      <div class="note">Each label covers about a quarter of qualified 2026 pitchers.</div>
      <div><b>Pitches per inning</b> is total pitches divided by innings pitched. Around 16 is typical for 2026; under 15 is efficient, over 18 means long, grinding innings. It doesn't change the score.</div>
    </div></section>`;
}

/* ---------- compare ---------- */
const cmpSel = { sp: load("ps:cmp", null), rp: load("ps:cmp-rp", null) };
let cmpMode = load("ps:cmpmode", "each");
const pColor = (id, role) => `var(--c${(Math.max(0, lists[role].findIndex(p => p.id === id)) % 6) + 1})`;

function compareChart(series, role) {
  const R = ROLES[role], T = R.T;
  const W2 = chartW(), H = Math.round(Math.min(420, Math.max(240, W2 * 0.4))), padL = 30, padR = 10, padT = 12, padB = 24;
  const ms = d => { const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day).getTime(); };
  const pts = series.map(s => {
    const sc = s.games.map(g => g.score);
    return s.games.map((g, i) => {
      const win = sc.slice(Math.max(0, i - R.roll + 1), i + 1);
      return { t: ms(g.date), v: cmpMode === "roll" ? mean(win) : g.score, g };
    });
  });
  const all = pts.flat();
  let t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(...all.map(p => p.t));
  if (t0 === t1) { t0 -= 864e5 * 7; t1 += 864e5 * 7; }
  const vs = all.map(p => p.v);
  const lo = Math.min(0, Math.floor(Math.min(...vs) / 10) * 10), hi = Math.max(100, Math.ceil(Math.max(...vs) / 10) * 10);
  const x = t => padL + (t - t0) / (t1 - t0) * (W2 - padL - padR);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  let s = `<svg viewBox="0 0 ${W2} ${H}" role="img" aria-label="Scores over the season for the selected ${R.title.toLowerCase()}">`;
  s += tierGrid(y, lo, hi, padL, W2 - padR, T);
  const d0 = new Date(t0); let m = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
  while (m.getTime() <= t1) {
    const xm = x(m.getTime());
    s += `<line x1="${xm}" x2="${xm}" y1="${padT}" y2="${H - padB}" stroke="var(--line)" stroke-width=".6"/>`;
    s += `<text x="${xm}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.toLocaleDateString(undefined, { month: "short" })}</text>`;
    m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
  }
  const dense = role === "rp" && cmpMode !== "roll";
  series.forEach((ser, k) => {
    const p = pts[k];
    s += `<polyline points="${p.map(q => `${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join(" ")}" fill="none" stroke="${ser.color}" stroke-width="${cmpMode === "roll" ? 2.4 : dense ? 1 : 1.6}" stroke-linejoin="round" stroke-linecap="round" ${cmpMode === "roll" ? "" : `stroke-opacity="${dense ? ".45" : ".75"}"`}/>`;
    for (const q of p) {
      s += `<circle cx="${x(q.t).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="${cmpMode === "roll" ? 1.8 : dense ? 2.2 : 3}" fill="${ser.color}"><title>${esc(ser.name)} · ${esc(fmtDate(q.g.date))} vs ${esc(q.g.opp)}: ${cmpMode === "roll" ? R.rollTxt + " " + fmt1(q.v) + " (this " + R.one + " " + q.g.score + ")" : q.g.score + " (" + tier(q.g.score, T).name + ")"}</title></circle>`;
    }
  });
  return s + "</svg>";
}

function viewCompare(role) {
  const R = ROLES[role], T = R.T;
  const avail = lists[role].filter(p => games(p.id, role).length);
  if (!cmpSel[role]) {
    cmpSel[role] = avail.map(p => ({ id: p.id, a: mean(scoresOf(regOf(games(p.id, role)))) || 0 }))
      .sort((a, b) => b.a - a.a).slice(0, 3).map(o => o.id);
  }
  const chosen = cmpSel[role];
  const sel = avail.filter(p => chosen.includes(p.id));
  let html = `<section style="display:flex;flex-direction:column;gap:16px">
    <div class="crumbs"><a href="#${role === "sp" ? "" : "rp"}">← All ${R.title.toLowerCase()}</a></div>
    ${roleTabs(role, r => ROLES[r].cmp)}
    <h1>Compare ${R.title.toLowerCase()}</h1>`;
  if (!avail.length) {
    $("#view").innerHTML = html + `<div class="empty">Follow a ${R.label} with ${SEASON} ${R.many} to compare.</div></section>`;
    return;
  }
  html += `<div class="chips" role="group" aria-label="${R.title} to compare">${avail.map(p =>
      `<button type="button" class="chip" style="--c:${pColor(p.id, role)}" aria-pressed="${chosen.includes(p.id)}" data-id="${p.id}"><i></i>${esc(p.name)}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Chart style">
      <button type="button" data-mode="each" aria-pressed="${cmpMode === "each"}">Each ${R.one}</button>
      <button type="button" data-mode="roll" aria-pressed="${cmpMode === "roll"}">${R.rollTxt[0].toUpperCase() + R.rollTxt.slice(1)}</button>
    </div>`;
  if (!sel.length) {
    html += `<div class="empty">Pick at least one ${R.label} above.</div>`;
  } else {
    const series = sel.map(p => ({ name: p.name, color: pColor(p.id, role), games: games(p.id, role) }));
    html += `<div class="chartbox">${compareChart(series, role)}
      <div class="legend">${series.map(s => `<span><i style="background:${s.color};border-radius:50%"></i>${esc(s.name)}</span>`).join("")}</div></div>
      <div class="note">${cmpMode === "roll" ? `Each point is the average of that ${R.one} and up to ${R.roll - 1} before it, which smooths out single good or bad outings.` : `Each point is one ${R.one}. Switch to ${R.rollTxt} to see trends more clearly.`}</div>
      <div class="tablewrap"><table class="ctable">
      <thead><tr><th>Pitcher</th><th>${role === "sp" ? "Starts" : "Outings"}</th><th>Avg</th><th>Post avg</th><th>Consistency</th><th>P/inn</th><th>Median</th><th>Best</th><th>Good+</th>${role === "rp" ? "<th>SV</th><th>HLD</th>" : ""}<th>Tier mix</th></tr></thead><tbody>`;
    sel.map(p => ({ p, gs: regOf(games(p.id, role)), post: scoresOf(postOf(games(p.id, role))) })).map(o => ({ ...o, sc: scoresOf(o.gs) }))
      .sort((a, b) => (isNaN(mean(b.sc)) ? -1e9 : mean(b.sc)) - (isNaN(mean(a.sc)) ? -1e9 : mean(a.sc)))
      .forEach(({ p, gs, sc, post }) => {
        const counts = T.map(t => sc.filter(v => tier(v, T) === t).length);
        html += `<tr class="g" style="cursor:default"><td><i style="background:${pColor(p.id, role)}"></i>${esc(p.name)}</td>
          <td>${sc.length}</td><td>${sc.length ? fmt1(mean(sc)) + " " + pill(mean(sc), T) : "–"}</td>
          <td>${post.length ? `${fmt1(mean(post))} <span class="note">(${post.length})</span>` : "–"}</td>
          <td>${consHTML(sdev(sc), role)}</td><td>${fmt1(ppi(gs))}</td>
          <td>${fmt1(median(sc))}</td><td>${maxOr(sc)}</td>
          <td>${sc.length ? Math.round(100 * sc.filter(v => v >= R.good).length / sc.length) + "%" : "–"}</td>
          ${role === "rp" ? `<td>${gs.reduce((a, g) => a + g.sv, 0)}</td><td>${gs.reduce((a, g) => a + g.hld, 0)}</td>` : ""}
          <td><div class="dist" title="${T.map((t, i) => counts[i] ? `${t.name}: ${counts[i]}` : "").filter(Boolean).join(", ")}">${T.map((t, i) => counts[i] ? `<span style="width:${100 * counts[i] / sc.length}%;background:var(${t.v})"></span>` : "").join("")}</div></td></tr>`;
      });
    html += `</tbody></table></div>`;
  }
  $("#view").innerHTML = html + `</section>`;
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.dataset.id);
    cmpSel[role] = chosen.includes(id) ? chosen.filter(x => x !== id) : [...chosen, id];
    save(role === "sp" ? "ps:cmp" : "ps:cmp-rp", cmpSel[role]); viewCompare(role);
  }));
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    cmpMode = b.dataset.mode; save("ps:cmpmode", cmpMode); viewCompare(role);
  }));
}

/* ---------- routing & refresh ---------- */
function route() {
  const h = location.hash.slice(1);
  let m;
  if (h === "formula") viewFormula();
  else if (h === "compare" || h === "compare-rp") { curRole = h === "compare" ? "sp" : "rp"; viewCompare(curRole); }
  else if (h === "leaders" || h === "leaders-rp") { curRole = h === "leaders" ? "sp" : "rp"; viewLeaders(curRole); }
  else if ((m = /^([pr])-(\d+)$/.exec(h))) { curRole = m[1] === "p" ? "sp" : "rp"; viewPitcher(Number(m[2]), curRole); }
  else { curRole = h === "rp" ? "rp" : "sp"; viewHome(curRole); }
  $("#cmplink").href = "#" + ROLES[curRole].cmp;
  $("#leadlink").href = "#" + ROLES[curRole].lead;
  $("#homelink").href = curRole === "rp" ? "#rp" : "#";
  const here = h === "" || h === "rp" ? "homelink" : /^leaders/.test(h) ? "leadlink" : /^compare/.test(h) ? "cmplink" : h === "formula" ? "fmlink" : "";
  for (const id of ["homelink", "leadlink", "cmplink", "fmlink"]) $("#" + id).toggleAttribute("aria-current", id === here);
  window.scrollTo(0, 0);
}

let refreshing = false;
async function refreshAll(force) {
  if (refreshing) return;
  refreshing = true;
  $("#refresh").disabled = true;
  setStatus(`Updating ${SEASON} from MLB…`);
  try { await loadTeams(); } catch {}
  const failed = [], season = SEASON;
  /* Past seasons don't change, so only load pitchers that aren't saved yet. */
  const todo = allIds().filter(p => force || season === CUR_SEASON || !logCache[p.id]);
  await pool(todo, 3, async p => {
    try { await fetchPitcher(p.id); } catch { failed.push(p.name); }
  });
  refreshing = false;
  $("#refresh").disabled = false;
  if (season !== SEASON) return refreshAll();
  if (failed.length) setStatus(`Couldn't update ${failed.join(", ")}. Check your connection and tap Refresh.`, true);
  else setStatus(`Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`);
  const keepRow = document.activeElement && document.activeElement.id === "q";
  if (!keepRow && !/^#leaders/.test(location.hash)) { const y = window.scrollY; route(); window.scrollTo(0, y); }
}

const sel = $("#seasonSel");
sel.innerHTML = SEASONS.map(s => `<option value="${s}" ${s === SEASON ? "selected" : ""}>${s} season</option>`).join("");
sel.addEventListener("change", () => {
  SEASON = Number(sel.value);
  save("ps:season", SEASON);
  logCache = load(logKey(), {});
  route();
  refreshAll();
});
$("#refresh").addEventListener("click", () => refreshAll(true));
window.addEventListener("hashchange", route);
/* Keep each table's header row in view while scrolling through its games. Tables can scroll
   sideways on phones, which stops CSS sticky from working, so the header cells are shifted by hand. */
function stickHeads() {
  for (const t of document.querySelectorAll(".tablewrap table")) {
    const head = t.tHead; if (!head) continue;
    const r = t.getBoundingClientRect(), hh = head.offsetHeight;
    const off = Math.max(0, Math.min(-r.top, r.height - hh - 40));
    for (const th of head.rows[0].cells) {
      th.style.transform = off ? `translateY(${off}px)` : "";
      th.classList.toggle("stuck", off > 0);
    }
  }
}
let stickQ = false;
window.addEventListener("scroll", () => { if (!stickQ) { stickQ = true; requestAnimationFrame(() => { stickQ = false; stickHeads(); }); } }, { passive: true });
new MutationObserver(() => stickHeads()).observe($("#view"), { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
let lastW = innerWidth, rsT;
window.addEventListener("resize", () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    if (Math.abs(innerWidth - lastW) < 40) return;   // ignore phone toolbar show/hide
    lastW = innerWidth;
    const y = scrollY; route(); scrollTo(0, y);
  }, 200);
});
route();
refreshAll();
</script>
</body>
